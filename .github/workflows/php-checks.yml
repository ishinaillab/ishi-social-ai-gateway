name: PHP checks

on:
  push:
    branches:
      - main
      - feature/chatfuel-sync-v1.1.0
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.3"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - name: Lint PHP
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)

      - name: Verify plugin version
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^ \* Version: 1\.1\.0$' ishi-social-ai-gateway.php
          grep -q "private const VERSION = '1.1.1';" ishi-social-ai-gateway.php
